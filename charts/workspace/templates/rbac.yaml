apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workspace.fullname" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
---
# ADR-029 emptied this Role. The workspace pod used to hold pods, pods/log and
# pods/exec in its own namespace because the worker created and deleted its own
# shell pods. The shell is now an operator-owned StatefulSet, and exec uses a
# short-lived token minted per request against a separate ServiceAccount, so
# the workspace pod needs no API access at all.
#
# Kept as an empty ruleset rather than deleted: removing the template would
# leave the old, wide Role in place on every namespace where this chart has
# already been applied. Applying an empty one is what actually revokes it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "workspace.fullname" . }}-shell
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "workspace.fullname" . }}-shell
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "workspace.fullname" . }}-shell
